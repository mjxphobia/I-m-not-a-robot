<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Burn Image</title>
  <style>
    :root{
      --bg:#9eb18c;    /* 페이지 배경 */
      --frame:#E6EBE1; /* 프레임 내부 색 */
      --max: 900px;    /* 데스크톱 최대 너비 */
    }
    html,body{
      margin:0; padding:0; min-height:100%;
      background:var(--bg);
      font-family: system-ui, "Noto Sans KR", sans-serif;
    }
    /* 가운데 정렬 레이아웃 */
    .center{
      min-height:100svh;
      display:flex; align-items:center; justify-content:center;
      padding:24px 16px;
    }
    /* 프레임 */
    .frame{
      width:min(var(--max), 100%);
      background:var(--frame);
      border-radius:20px;
      padding:14px;
      box-shadow:
        0 10px 24px rgba(0,0,0,.18),
        0 2px 0 rgba(255,255,255,.35) inset;
    }
    /* 이미지: 반응형 */
    .frame img{
      display:block;
      width:clamp(240px, 80vw, var(--max));
      height:auto;
      border-radius:12px;
    }

    @media (max-width:480px){
      .frame{ padding:10px; border-radius:16px; }
      .frame img{ border-radius:10px; }
    }
  </style>
</head>
<body>
  <main class="center">
    <div class="frame" role="figure" aria-label="burn 이미지">
      <img src="static/burn.png" alt="burn" />
    </div>
  </main>
</body>
</html>
